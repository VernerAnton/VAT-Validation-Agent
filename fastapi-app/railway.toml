[build]
builder = "DOCKERFILE"
dockerfilePath = "fastapi-app/Dockerfile"
watchPatterns = ["fastapi-app/**", "shared/**"]

[deploy]
startCommand = "uvicorn fastapi-app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
